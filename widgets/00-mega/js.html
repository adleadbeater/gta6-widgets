<script>
(function () {
  'use strict';

  var NS = 'MWGTA6';
  if (window[NS]) { window[NS].mountAll(); return; }

  var REFRESH_MS = 300000;
  var TICK_MS = 250;
  var SLOW_TICK_MS = 60000;
  var CAP_SEC = 36 * 3600;
  var DAY_MS = 86400000;
  var ETA_MAX_SEC = 14 * 86400;
  var BYDAY_MAX = 14;
  var DOT = ' \u00b7 ';
  var DASH = '\u2014';
  var UP = '\u25b2';
  var DOWN = '\u25bc';
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var CATS = { tracker: 'GTA 6 Sales Tracker Vignette', copies: 'GTA 6 Copies Chart Vignette', revenue: 'GTA 6 Revenue Chart Vignette' };
  var MAX_EVENTS = 50;
  var BUILD = '1.3.0+20261119.51601a0';
  var DEBUG = /[?&]gta6debug=1(&|$)/.test(location.search);
  var IDS = { tracker: 'gta6-sales-tracker', copies: 'gta6-copies-chart', revenue: 'gta6-revenue-chart' };
  var PLATFORMS = [
    { id: 'all', label: 'All platforms' },
    { id: 'ps5', label: 'PS5' },
    { id: 'xbox', label: 'Xbox Series X|S' }
  ];
  var MODES = [
    { id: 'launch', label: 'Launch' },
    { id: 'all', label: 'All time' }
  ];
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  var reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var instances = [];
  var events = 0;
  var requests = {};

  /* ---------- helpers ---------- */

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) { return ESC[ch]; });
  }

  function warn(msg, err) {
    if (window.console && console.warn) console.warn('[mw-gta6] ' + msg, err || '');
  }

  function slug(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }

  // Readable category, snake_case action, slug label; never reader data or URLs
  function track(cat, action, label) {
    if (events >= MAX_EVENTS) return;
    events += 1;
    var tries = 0;
    label = slug(label);
    (function attempt() {
      var s = window.websiteSentinel;
      if (s && typeof s.sendEvent === 'function') {
        try { s.sendEvent(cat, action, label); } catch (e) { /* tracking must never break the widget */ }
        return;
      }
      tries += 1;
      if (tries < 20) setTimeout(attempt, 250);
    })();
  }

  function dateParts(iso) {
    var p = String(iso || '').slice(0, 10).split('-');
    var m = parseInt(p[1], 10) - 1;
    var d = parseInt(p[2], 10);
    if (!(m >= 0 && m < 12) || !d) return null;
    return { y: p[0], m: MONTHS[m], d: d };
  }
  function fmtDate(iso) { var p = dateParts(iso); return p ? p.m + ' ' + p.d + ', ' + p.y : DASH; }
  function fmtShort(iso) { var p = dateParts(iso); return p ? p.m + ' ' + p.d : DASH; }
  function dayMs(iso) { return Date.parse(String(iso).slice(0, 10) + 'T00:00:00Z'); }
  function addDays(iso, n) { return new Date(dayMs(iso) + n * DAY_MS).toISOString().slice(0, 10); }
  function whole(n) { return Math.floor(n).toLocaleString('en-US'); }
  function trim2(n) { return String(parseFloat(n.toFixed(2))); }
  function mUnits(n) {
    if (n >= 999500) return trim2(n / 1e6) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return whole(n);
  }
  function usd(n, plus) {
    var s = n >= 999.5e6 ? '$' + trim2(n / 1e9) + 'B' : n >= 999500 ? '$' + Math.round(n / 1e6) + 'M' : '$' + Math.round(n / 1000) + 'K';
    return plus ? s + '+' : s;
  }
  function gapUnits(n) { return n >= 999500 ? mUnits(n) : mUnits(n) + ' copies'; }
  function gapUsd(n) { return usd(Math.max(1000, n)); }
  function fmtDur(sec) {
    var h = sec / 3600;
    if (h < 1) return 'under an hour';
    if (h < 1.5) return 'about an hour';
    if (h < 48) return 'about ' + Math.round(h) + ' hours';
    return 'about ' + Math.round(h / 24) + ' days';
  }
  function time(r) { return Date.parse(r.at || r.date); }
  function isNum(v) { return typeof v === 'number' && isFinite(v) && v >= 0; }

  /* ---------- data ---------- */

  function fetchJSON(url) {
    var bucket = Math.floor(Date.now() / REFRESH_MS);
    var key = url + '|' + bucket;
    if (requests[key]) return requests[key];
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 10000) : null;
    var href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + bucket;
    requests[key] = fetch(href, { credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
        return r.json();
      })
      .catch(function (e) {
        if (timer) clearTimeout(timer);
        delete requests[key];
        throw e;
      });
    return requests[key];
  }

  // needs: [{ name, optional }]; an optional file that fails to load resolves to null
  function loadData(root, needs) {
    var base = String(root.getAttribute('data-src') || '').trim();
    var seed = window.MWGTA6_SEED || null;
    if (base && !/^https:\/\//i.test(base)) return Promise.reject(new Error('data-src must be an https URL'));
    if (base && base.charAt(base.length - 1) !== '/') base += '/';
    return Promise.all(needs.map(function (n) {
      var p;
      if (!base) {
        p = seed && seed[n.name] ? Promise.resolve(seed[n.name]) : Promise.reject(new Error('no data-src and no seed for ' + n.name));
      } else {
        p = fetchJSON(base + n.name + '.json').catch(function (e) {
          if (seed && seed[n.name]) return seed[n.name];
          throw e;
        });
      }
      return n.optional ? p.catch(function () { return null; }) : p;
    }));
  }

  function validTracker(d) {
    if (!d || !Array.isArray(d.readings) || !d.readings.length) return false;
    for (var i = 0; i < d.readings.length; i++) {
      var r = d.readings[i];
      if (!r || !isNum(r.units) || !isNum(r.revenue) || !dateParts(r.date) || isNaN(time(r))) return false;
      if (r.platforms) {
        var p = r.platforms;
        if (!p.ps5 || !p.xbox || !isNum(p.ps5.units) || !isNum(p.xbox.units) || !isNum(p.ps5.revenue) || !isNum(p.xbox.revenue)) return false;
      }
    }
    return true;
  }

  function validComparisons(d) {
    if (!d) return false;
    return ['copies', 'revenue'].every(function (k) {
      var s = d[k];
      return s && s.title && ['launch', 'all'].every(function (m) {
        return s[m] && Array.isArray(s[m].items) && s[m].items.length && s[m].items.every(function (x) {
          return x && x.title && (x.live === true || isNum(x.amt));
        });
      });
    });
  }

  function pathOf(u) {
    var a = document.createElement('a');
    a.href = u;
    return a.pathname.replace(/\/+$/, '');
  }

  // Related links: MovieWeb articles only, at most 3, never the page they sit on
  function validLinks(d) {
    if (!d || !Array.isArray(d.items)) return null;
    var here = location.pathname.replace(/\/+$/, '');
    var items = d.items.filter(function (x) {
      return x && typeof x.title === 'string' && x.title.trim() && typeof x.url === 'string' &&
        /^https:\/\/(www\.)?movieweb\.com\//i.test(x.url) && pathOf(x.url) !== here;
    }).slice(0, 3);
    if (!items.length) return null;
    return { title: typeof d.title === 'string' && d.title.trim() ? d.title : 'More on GTA 6', items: items };
  }

  // Daily cumulative history; optional, so a bad series is dropped, never fatal
  function parseSeries(s) {
    if (!s || !Array.isArray(s.rows) || !Array.isArray(s.fields)) return null;
    var ix = {};
    s.fields.forEach(function (k, i) { ix[k] = i; });
    var need = ['date', 'ps5Units', 'xboxUnits', 'ps5Revenue', 'xboxRevenue'];
    if (!need.every(function (k) { return k in ix; })) return null;
    var out = [];
    for (var i = 0; i < s.rows.length; i++) {
      var r = s.rows[i];
      if (!Array.isArray(r) || !dateParts(r[ix.date])) return null;
      var v = need.slice(1).map(function (k) { var j = ix[k]; return r[j]; });
      if (!v.every(isNum)) return null;
      out.push({ d: String(r[ix.date]).slice(0, 10), ps5: { units: v[0], revenue: v[2] }, xbox: { units: v[1], revenue: v[3] } });
    }
    out.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    return out.length >= 2 ? out : null;
  }

  function model(t, cmp) {
    var rs = t.readings.slice().sort(function (a, b) { return time(b) - time(a); });
    var r0 = rs[0];
    var r1 = rs[1] || null;
    var uRate = 0;
    var rRate = 0;
    if (r1) {
      var dt = (time(r0) - time(r1)) / 1000;
      if (dt > 0) {
        uRate = Math.max(0, (r0.units - r1.units) / dt);
        rRate = Math.max(0, (r0.revenue - r1.revenue) / dt);
      }
    }
    var withP = rs.filter(function (r) { return !!r.platforms; });

    // Official figure: shown beside the estimate, never in place of it (the two count
    // different things). Revenue is optional.
    var off = t.official;
    var official = null;
    if (off && isNum(off.units) && off.units > 0 && dateParts(off.date)) {
      var od = String(off.date).slice(0, 10);
      official = {
        date: od,
        units: off.units,
        revenue: isNum(off.revenue) && off.revenue > 0 ? off.revenue : null,
        source: typeof off.source === 'string' && off.source.trim() ? off.source : 'Take-Two',
        url: /^https:\/\//.test(off.url || '') ? off.url : null,
        note: typeof off.note === 'string' ? off.note : '',
        est: null
      };
      for (var i = 0; i < rs.length; i++) {
        if (String(rs[i].date).slice(0, 10) <= od) { official.est = rs[i]; break; }
      }
    }

    var g = cmp && cmp.gta6;
    return {
      rs: rs, r0: r0, r1: r1, t0: time(r0), uRate: uRate, rRate: rRate,
      p0: withP[0] || null, p1: withP[1] || null, official: official,
      series: parseSeries(t.series),
      release: g && dateParts(g.release) ? String(g.release).slice(0, 10) : null,
      launchDays: g && g.launchDays >= 1 ? Math.floor(g.launchDays) : 3
    };
  }

  // Projected figure. Past the 36-hour cap it stops projecting and shows the latest
  // real reading, so a stalled feed never leaves an inflated number on screen.
  function live(m, now) {
    var dt = Math.max(0, (now - m.t0) / 1000);
    if (dt > CAP_SEC) return { units: m.r0.units, revenue: m.r0.revenue, stale: true };
    return { units: m.r0.units + m.uRate * dt, revenue: m.r0.revenue + m.rRate * dt, stale: false };
  }

  function nowFor(st) { return st.paused ? st.pausedAt : Date.now(); }

  function forPlatform(m, L, key) {
    if (key === 'all' || !m.p0) return L;
    var p = m.p0.platforms[key];
    return { units: L.units * p.units / m.p0.units, revenue: L.revenue * p.revenue / m.p0.revenue, stale: L.stale };
  }

  /* ---------- shared panel parts ---------- */

  function shareHTML(st) {
    if (!st.showShare) return '';
    return '<div class="mw-gta6__foot"><span class="mw-gta6__status" role="status" aria-live="polite"></span>' +
      '<button type="button" class="mw-gta6__quiet" data-action="share">Copy link</button></div>';
  }

  function linksHTML(st) {
    var L = st.links;
    if (!L) return '';
    return '<nav class="mw-gta6__more" aria-label="' + esc(L.title) + '"><a class="mw-gta6__morelink" href="' + esc(L.items[0].url) +
      '" target="_blank" rel="noopener" data-track="related">' + esc(L.title) + '</a></nav>';
  }

  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = s;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  function share(st) {
    var cat = CATS[st.kind];
    var url = location.href.split('#')[0] + '#' + st.shareTo;
    var status = st.el.querySelector('.mw-gta6__status');
    function say(msg) {
      if (!status) return;
      status.textContent = msg;
      clearTimeout(st.sayTimer);
      st.sayTimer = setTimeout(function () { status.textContent = ''; }, 4000);
    }
    copyText(url).then(function () {
      say('Link copied');
      track(cat, 'share', 'copy');
    }, function () { say('Copy this link: ' + url); });
  }

  /* ---------- tracker ---------- */

  function niceMax(v) {
    var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
    return 10 * p;
  }

  // Sales by day: copies and revenue added each day (where the history has one-day steps),
  // newest first, in a collapsed section; follows the platform buttons
  function byDayHTML(st) {
    var m = st.m;
    if (!m.series) return '';
    var key = st.platform;
    function pick(p, f) { return key === 'all' ? p.ps5[f] + p.xbox[f] : p[key][f]; }
    var rows = [];
    for (var i = m.series.length - 1; i > 0 && rows.length < BYDAY_MAX + 1; i--) {
      var a = m.series[i - 1];
      var b = m.series[i];
      if (Math.round((dayMs(b.d) - dayMs(a.d)) / DAY_MS) !== 1) break;
      rows.push({ d: b.d, u: pick(b, 'units') - pick(a, 'units'), r: pick(b, 'revenue') - pick(a, 'revenue') });
    }
    if (!rows.length) return '';
    rows.forEach(function (r, j) { r.c = rows[j + 1] ? r.u - rows[j + 1].u : null; });
    rows = rows.slice(0, BYDAY_MAX);
    var id = st.el.id + '-byday';
    var pname = key === 'all' ? '' : (key === 'ps5' ? 'PS5' : 'Xbox Series X|S');
    var h = '<div class="mw-gta6__block mw-gta6__byday">';
    h += '<div><button type="button" class="mw-gta6__quiet mw-gta6__quiet--wide" data-action="byday" aria-expanded="' + (st.byDay ? 'true' : 'false') +
      '" aria-controls="' + id + '">' + (st.byDay ? 'Hide' : 'Show') + ' sales by day' + (pname ? DOT + esc(pname) : '') + '</button></div>';
    h += '<div class="mw-gta6__block" id="' + id + '"' + (st.byDay ? '' : ' hidden') + '>';
    h += '<div class="mw-gta6__scroll" tabindex="0" role="region" aria-label="Sales by day"><table class="mw-gta6__table"><caption class="mw-gta6__sr">Sales by day' + (pname ? ', ' + esc(pname) : '') +
      '</caption><thead><tr><th scope="col">Day</th><th scope="col">Copies</th><th scope="col">Revenue</th><th scope="col">Change</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr><td>' + esc(fmtDate(r.d)) + (r.d === m.release ? ' <span class="mw-gta6__tag">Launch</span>' : '') + '</td><td>' +
        esc(mUnits(r.u)) + '</td><td>' + esc(usd(r.r)) + '</td><td class="mw-gta6__chgcell">' + movement(r.c) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="mw-gta6__caption">Copies and revenue added each day, including pre-orders; change is against the day before. Runs about two days behind the latest reading.</p>';
    return h + '</div></div>';
  }

  // Movement glyphs: up green, down red, same as "=", each with screen-reader text
  function movement(v) {
    if (v === null) return DASH;
    if (v > 0) return '<span class="mw-gta6__up" aria-hidden="true">' + UP + '</span><span class="mw-gta6__sr">up </span>' + esc(mUnits(v));
    if (v < 0) return '<span class="mw-gta6__down" aria-hidden="true">' + DOWN + '</span><span class="mw-gta6__sr">down </span>' + esc(mUnits(-v));
    return '<span class="mw-gta6__muted" aria-hidden="true">=</span><span class="mw-gta6__sr">no change</span>';
  }

  function trackerHTML(st) {
    var m = st.m;
    var L = live(m, nowFor(st));
    var V = forPlatform(m, L, st.platform);
    var dU = null;
    var dR = null;
    var since = '';
    if (st.platform === 'all') {
      if (m.r1) { dU = m.r0.units - m.r1.units; dR = m.r0.revenue - m.r1.revenue; since = fmtShort(m.r1.date); }
    } else if (m.p0 && m.p1) {
      var a = m.p0.platforms[st.platform];
      var b = m.p1.platforms[st.platform];
      dU = a.units - b.units; dR = a.revenue - b.revenue; since = fmtShort(m.p1.date);
    }
    function change(v, f) {
      if (v === null) return '<div class="mw-gta6__chg">' + DASH + '</div>';
      return '<div class="mw-gta6__chg"><span class="mw-gta6__up" aria-hidden="true">' + UP + '</span><span class="mw-gta6__sr">up </span><strong>' +
        esc(f(v)) + '</strong> since ' + esc(since) + '</div>';
    }
    var meta = 'Worldwide digital sales on PS5 and Xbox Series X|S' + DOT + 'Latest reading ' + esc(fmtDate(m.r0.date));

    var h = '';
    h += '<div class="mw-gta6__head"><h2 class="mw-gta6__h">GTA 6 Sales Tracker</h2>' +
      '<span class="mw-gta6__badge">' + (L.stale ? 'Latest reading' : 'Live estimate') + '</span></div>';
    h += '<p class="mw-gta6__meta">' + meta + '<span data-live="status">' + (L.stale ? DOT + 'Awaiting next update' : '') + '</span></p>';
    h += '<p class="mw-gta6__sr">As of the ' + esc(fmtDate(m.r0.date)) + ' reading: ' + esc(whole(m.r0.units)) +
      ' copies and $' + esc(whole(m.r0.revenue)) + ' in revenue.</p>';

    if (m.p0) {
      h += '<div class="mw-gta6__btns" role="group" aria-label="Platform">';
      PLATFORMS.forEach(function (p) {
        h += '<button type="button" class="mw-gta6__btn" data-platform="' + p.id + '" aria-pressed="' +
          (p.id === st.platform ? 'true' : 'false') + '">' + esc(p.label) + '</button>';
      });
      h += '</div>';
    }

    h += '<div class="mw-gta6__stats">';
    h += '<div class="mw-gta6__stat"><div class="mw-gta6__label">Revenue</div>' +
      '<div class="mw-gta6__num" data-live="rev" aria-live="off">$' + whole(V.revenue) + '</div>' + change(dR, usd) + '</div>';
    h += '<div class="mw-gta6__stat"><div class="mw-gta6__label">Copies sold</div>' +
      '<div class="mw-gta6__num" data-live="units" aria-live="off">' + whole(V.units) + '</div>' + change(dU, mUnits) + '</div>';
    h += '</div>';
    if (!L.stale) {
      h += '<div class="mw-gta6__liverow"><button type="button" class="mw-gta6__quiet" data-action="pause">' +
        (st.paused ? 'Resume live count' : 'Pause live count') + '</button></div>';
    }

    if (m.p0) {
      var ps = m.p0.platforms.ps5;
      var xb = m.p0.platforms.xbox;
      var share = ps.units / m.p0.units;
      var psPct = Math.round(share * 100);
      h += '<div class="mw-gta6__block"><div class="mw-gta6__label">Platform split</div>';
      h += '<div class="mw-gta6__split" role="img" aria-label="PS5 ' + psPct + ' percent, Xbox Series X|S ' + (100 - psPct) + ' percent">' +
        '<span style="width:' + (share * 100).toFixed(1) + '%"></span><span></span></div>';
      h += '<div class="mw-gta6__legend">' +
        '<div><span class="mw-gta6__sw" aria-hidden="true"></span><strong>PS5 ' + psPct + '%</strong> <span class="mw-gta6__muted">' +
        esc(mUnits(ps.units)) + ' copies' + DOT + esc(usd(ps.revenue)) + '</span></div>' +
        '<div><span class="mw-gta6__sw mw-gta6__sw--alt" aria-hidden="true"></span><strong>Xbox Series X|S ' + (100 - psPct) +
        '%</strong> <span class="mw-gta6__muted">' + esc(mUnits(xb.units)) + ' copies' + DOT + esc(usd(xb.revenue)) + '</span></div>' +
        '</div></div>';
    }

    if (m.official) {
      var o = m.official;
      var e = o.est;
      h += '<div class="mw-gta6__block"><div class="mw-gta6__label">Official vs. estimate' + DOT + 'all platforms</div><div class="mw-gta6__vs">';
      h += '<div class="mw-gta6__vsitem"><div class="mw-gta6__muted">' + esc(o.source) + ', official</div>' +
        '<div class="mw-gta6__vsnum">' + esc(mUnits(o.units)) + ' copies</div>' +
        (o.revenue ? '<div>' + esc(usd(o.revenue)) + '</div>' : '') +
        '<div class="mw-gta6__muted">As of ' + esc(fmtDate(o.date)) + '</div></div>';
      if (e) {
        h += '<div class="mw-gta6__vsitem"><div class="mw-gta6__muted">Estimate</div>' +
          '<div class="mw-gta6__vsnum">' + esc(mUnits(e.units)) + ' copies</div><div>' + esc(usd(e.revenue)) + '</div>' +
          '<div class="mw-gta6__muted">' + esc(fmtDate(e.date)) + ' reading</div></div>';
      }
      h += '</div><p class="mw-gta6__caption">' + (o.note ? esc(o.note) + ' ' : '') +
        'Official totals can include physical copies and other platforms.</p></div>';
    }

    h += byDayHTML(st);

    var rows = m.rs.slice(0, 5);
    h += '<div class="mw-gta6__scroll" tabindex="0" role="region" aria-label="Readings"><table class="mw-gta6__table"><thead><tr>' +
      '<th scope="col">Reading</th><th scope="col">Copies</th><th scope="col">Revenue</th><th scope="col">Change</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var prev = m.rs[i + 1];
      var chg = prev ? '<span class="mw-gta6__up" aria-hidden="true">' + UP + '</span><span class="mw-gta6__sr">up </span>' + esc(mUnits(r.units - prev.units)) : DASH;
      h += '<tr><td>' + esc(fmtDate(r.date)) + '</td><td>' + esc(mUnits(r.units)) + '</td><td>' + esc(usd(r.revenue)) +
        '</td><td class="mw-gta6__chgcell">' + chg + '</td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<p class="mw-gta6__caption">' + (L.stale
      ? 'Showing the latest reading; next update delayed. '
      : 'Live figure projected from the latest reading. ') +
      'Estimates; excludes physical copies.</p>';
    h += shareHTML(st);
    h += linksHTML(st);
    return h;
  }

  function tickTracker(st) {
    var L = live(st.m, nowFor(st));
    if (L.stale !== st.stale) { render(st); return; }
    var V = forPlatform(st.m, L, st.platform);
    var r = st.el.querySelector('[data-live="rev"]');
    var u = st.el.querySelector('[data-live="units"]');
    if (r) r.textContent = '$' + whole(V.revenue);
    if (u) u.textContent = whole(V.units);
  }

  /* ---------- charts ---------- */

  // GTA 6's like-for-like launch figure: the estimated cumulative total at the end of
  // its first N days (pre-orders included, as for the other games). Null without a
  // release date; { pending } until the series reaches that day.
  function gtaLaunch(st) {
    var m = st.m;
    if (st.mode !== 'launch' || !m.release) return null;
    var end = addDays(m.release, m.launchDays - 1);
    var row = null;
    if (m.series) {
      for (var i = 0; i < m.series.length; i++) { if (m.series[i].d >= end) { row = m.series[i]; break; } }
    }
    if (!row) return { pending: true, end: end };
    return {
      pending: false, end: row.d,
      days: Math.round((dayMs(row.d) - dayMs(m.release)) / DAY_MS) + 1,
      units: row.ps5.units + row.xbox.units,
      revenue: row.ps5.revenue + row.xbox.revenue
    };
  }

  function chartRows(st) {
    var m = st.m;
    var set = st.cmp[st.kind];
    var view = set[st.mode];
    var copies = st.kind === 'copies';
    var now = Date.now();
    var L = live(m, now);
    var liveAmt = copies ? L.units : L.revenue;
    var rate = L.stale ? 0 : (copies ? m.uRate : m.rRate);
    var base0 = copies ? m.r0.units : m.r0.revenue;
    var base1 = m.r1 ? (copies ? m.r1.units : m.r1.revenue) : null;
    var gl = gtaLaunch(st);
    var prefix = copies ? '' : 'Game \u00b7 ';
    var fixed = false;

    var items = view.items.map(function (x) {
      var o = {};
      for (var k in x) { if (Object.prototype.hasOwnProperty.call(x, k)) o[k] = x[k]; }
      if (x.live) {
        o.me = true;
        if (gl && !gl.pending) {
          o.amt = copies ? gl.units : gl.revenue;
          o.sub = prefix + 'First ' + gl.days + ' days';
          fixed = true;
        } else {
          o.amt = liveAmt;
          o.sub = gl ? prefix + 'Pre-orders + sales to date' : (L.stale ? prefix + 'Latest reading' : x.sub);
        }
      }
      return o;
    });
    items.sort(function (a, b) { return b.amt - a.amt; });
    var myIdx = -1;
    for (var i = 0; i < items.length; i++) { if (items[i].me) { myIdx = i; break; } }
    var list = items.slice(0, 10);
    var pinned = myIdx >= 10 ? items[myIdx] : null;
    if (pinned) list.push(pinned);
    var max = Math.max.apply(null, list.map(function (x) { return x.amt; }));
    var fmt = copies ? function (x) { return mUnits(x.amt); } : function (x) { return usd(x.amt, x.plus); };

    var out = '';
    list.forEach(function (x, i) {
      var isPin = pinned && x === pinned;
      var rank = isPin ? (view.pinRank || String(myIdx + 1)) : String(i + 1);
      var sub = x.year + DOT + x.sub;
      var subShort = String(x.year) + (x.sub === 'Lifetime' ? '' : DOT + String(x.sub).replace(/^(Film|Game) \u00b7 /, ''));
      // est: an outside estimate, not a publisher figure; asterisked on screen, spelled out for screen readers
      var val = fmt(x) + (x.est ? '*' : '');
      var spoken = fmt(x) + (x.est ? ', estimate' : '');
      if (isPin) out += '<li class="mw-gta6__gap" aria-hidden="true">\u00b7\u00b7\u00b7</li>';
      out += '<li class="mw-gta6__row' + (x.me ? ' mw-gta6__row--me' : '') + '" aria-label="' +
        esc(rank + '. ' + x.title + ' (' + x.year + '), ' + x.sub + ': ' + spoken) + '">' +
        '<span class="mw-gta6__rank" aria-hidden="true">' + esc(rank) + '</span>' +
        '<span class="mw-gta6__lab" aria-hidden="true"><span class="mw-gta6__title" title="' + esc(x.title) + '">' + esc(x.title) + '</span>' +
        '<span class="mw-gta6__sub">' + esc(sub) + '</span><span class="mw-gta6__subs">' + esc(subShort) + '</span></span>' +
        '<span class="mw-gta6__barwrap" aria-hidden="true"><span class="mw-gta6__bar' + (x.film ? ' mw-gta6__bar--film' : '') +
        '" style="--w:' + (x.amt / max).toFixed(4) + '"></span><span class="mw-gta6__val">' + esc(val) + '</span></span></li>';
    });

    // Next-overtake line: only while GTA 6's figure is live, and only against an entry that
    // is really next (not across the unlisted gap behind a fixed pinRank such as "50+")
    var next = '';
    if (myIdx >= 0 && !fixed) {
      var gapFmt = copies ? gapUnits : gapUsd;
      var parts = [];
      var below = items[myIdx + 1];
      if (below && rate > 0 && below.amt > base0 && below.amt <= liveAmt) {
        var ago = (now - (m.t0 + (below.amt - base0) / rate * 1000)) / 1000;
        if (ago >= 0 && ago <= 86400) parts.push('Passed <strong>' + esc(below.title) + '</strong> ' + (ago < 3600 ? 'within the hour' : fmtDur(ago) + ' ago'));
      } else if (below && base1 !== null && below.amt > base1 && below.amt <= base0) {
        parts.push('Passed <strong>' + esc(below.title) + '</strong> in the ' + esc(fmtShort(m.r0.date)) + ' reading');
      }
      var above = myIdx > 0 ? items[myIdx - 1] : null;
      if (above && !(myIdx >= 10 && view.pinRank)) {
        var gap = above.amt - liveAmt;
        var s = 'Next: <strong>' + esc(above.title) + '</strong>, ' + esc(gapFmt(gap)) + ' to go';
        if (rate > 0 && gap / rate <= ETA_MAX_SEC) s += DOT + esc(fmtDur(gap / rate)) + ' at the current pace';
        parts.push(s);
      } else if (myIdx === 0) {
        parts.push('<strong>GTA 6</strong> tops this chart');
      }
      next = parts.join(DOT);
    }
    return { html: out, next: next };
  }

  function chartHTML(st) {
    var set = st.cmp[st.kind];
    var view = set[st.mode];
    var rows = chartRows(st);
    st.last = rows.html;
    st.lastNext = rows.next;
    var h = '';
    h += '<div class="mw-gta6__head"><h2 class="mw-gta6__h">' + esc(set.title) + '</h2></div>';
    h += '<p class="mw-gta6__meta">' + esc(view.meta) + '</p>';
    h += '<div class="mw-gta6__chart-head"><div class="mw-gta6__switch" role="group" aria-label="Time period">';
    MODES.forEach(function (md) {
      h += '<button type="button" data-mode="' + md.id + '" aria-pressed="' + (md.id === st.mode ? 'true' : 'false') + '">' + esc(md.label) + '</button>';
    });
    h += '</div>';
    if (set.legend) {
      h += '<div class="mw-gta6__keys"><div><span class="mw-gta6__sw" aria-hidden="true"></span>Games</div>' +
        '<div><span class="mw-gta6__sw mw-gta6__sw--alt" aria-hidden="true"></span>Films</div></div>';
    }
    h += '</div>';
    h += '<ol class="mw-gta6__bars">' + rows.html + '</ol>';
    h += '<p class="mw-gta6__next" data-live="next"' + (rows.next ? '' : ' hidden') + '>' + rows.next + '</p>';
    if (view.note) h += '<p class="mw-gta6__caption">' + esc(view.note) + '</p>';
    h += shareHTML(st);
    h += linksHTML(st);
    return h;
  }

  function tickChart(st) {
    var rows = chartRows(st);
    if (rows.html !== st.last) {
      st.last = rows.html;
      var ol = st.el.querySelector('.mw-gta6__bars');
      if (ol) ol.innerHTML = rows.html;
    }
    if (rows.next !== st.lastNext) {
      st.lastNext = rows.next;
      var nx = st.el.querySelector('[data-live="next"]');
      if (nx) { nx.innerHTML = rows.next; nx.hidden = !rows.next; }
    }
  }

  /* ---------- lifecycle ---------- */

  function render(st) {
    var active = document.activeElement;
    var refocus = null;
    if (active && st.el.contains(active)) {
      if (active.getAttribute('data-platform')) refocus = '[data-platform="' + active.getAttribute('data-platform') + '"]';
      else if (active.getAttribute('data-mode')) refocus = '[data-mode="' + active.getAttribute('data-mode') + '"]';
      else if (active.getAttribute('data-action')) refocus = '[data-action="' + active.getAttribute('data-action') + '"]';
    }
    st.lastTick = Date.now();
    if (st.kind === 'tracker') {
      st.stale = live(st.m, nowFor(st)).stale;
      st.el.innerHTML = trackerHTML(st);
    } else {
      st.el.innerHTML = chartHTML(st);
    }
    st.el.setAttribute('aria-label', st.kind === 'tracker' ? 'GTA 6 sales tracker' : st.cmp[st.kind].title);
    if (refocus) {
      var target = st.el.querySelector(refocus);
      if (target) target.focus();
    }
  }

  function bind(st) {
    var el = st.el;
    el.addEventListener('click', function (ev) {
      var t = ev.target;
      while (t && t !== el && !(t.tagName === 'BUTTON' || t.tagName === 'A')) t = t.parentNode;
      if (!t || t === el) return;
      var cat = CATS[st.kind];
      if (t.tagName === 'A') {
        track(t.getAttribute('data-track') === 'related' ? CATS.tracker : cat, 'link_click', t.textContent);
        return;
      }
      var act = t.getAttribute('data-action');
      if (act === 'pause') {
        st.paused = !st.paused;
        st.pausedAt = Date.now();
        render(st);
        track(cat, st.paused ? 'pause' : 'resume', 'live-count');
        return;
      }
      if (act === 'share') { share(st); return; }
      if (act === 'byday') {
        st.byDay = !st.byDay;
        render(st);
        track(cat, st.byDay ? 'by_day_open' : 'by_day_close', 'sales-by-day');
        return;
      }
      var p = t.getAttribute('data-platform');
      var md = t.getAttribute('data-mode');
      if (p && p !== st.platform) {
        st.platform = p;
        render(st);
        track(cat, 'tab_switch', p);
      } else if (md && md !== st.mode) {
        st.mode = md;
        render(st);
        track(cat, 'period_switch', md === 'all' ? 'all-time' : 'launch');
      }
    });
  }

  function bindScroll(st) {
    st.el.addEventListener('scroll', function (ev) {
      var box = ev.target;
      if (box && box.classList && box.classList.contains('mw-gta6__scroll')) box.classList.toggle('is-scrolled', box.scrollLeft > 0);
    }, true);
  }

  function observe(st) {
    if (!('IntersectionObserver' in window)) {
      st.visible = true;
      track(CATS[st.kind], 'view', st.kind);
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        st.visible = e.isIntersecting;
        if (!st.impressed && e.intersectionRatio >= 0.5) {
          st.impressed = true;
          track(CATS[st.kind], 'view', st.kind);
        }
      });
    }, { threshold: [0, 0.5] });
    io.observe(st.el);
  }

  function needsFor(kinds) {
    var charts = kinds.indexOf('copies') >= 0 || kinds.indexOf('revenue') >= 0;
    // comparisons.json also carries the release date the tracker's by-day table marks
    var needs = [{ name: 'tracker' }, { name: 'comparisons', optional: !charts }];
    if (kinds.indexOf('tracker') >= 0) needs.push({ name: 'links', optional: true });
    return needs;
  }

  function apply(inst, res) {
    var d = {};
    inst.needs.forEach(function (n, i) { d[n.name] = res[i]; });
    if (!validTracker(d.tracker)) throw new Error('tracker.json failed validation');
    var cmp = validComparisons(d.comparisons) ? d.comparisons : null;
    if (inst.charts && !cmp) throw new Error('comparisons.json failed validation');
    var links = validLinks(d.links);
    var m = model(d.tracker, cmp);
    inst.parts.forEach(function (st) {
      st.m = m;
      st.cmp = cmp;
      st.links = st.hostLinks ? links : null;
      render(st);
    });
  }

  // Panel ids are the share anchors: handed out in page order when mounting starts,
  // so they never depend on which widget's data happens to arrive first
  var usedIds = {};
  function uniqueId(base) {
    var id = base;
    var n = 2;
    while (usedIds[id] || document.getElementById(id)) { id = base + '-' + n; n += 1; }
    usedIds[id] = true;
    return id;
  }

  // A shared #anchor could not scroll before its widget existed. Scroll once it does, and
  // again as widgets above it finish loading, until the reader scrolls for themselves.
  var readerScrolled = false;
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (ev) {
    window.addEventListener(ev, function () { readerScrolled = true; }, { passive: true, once: true });
  });
  function scrollToHash() {
    if (readerScrolled || !location.hash) return;
    var id = location.hash.slice(1);
    var el = /^gta6-/.test(id) ? document.getElementById(id) : null;
    if (el && el.scrollIntoView) el.scrollIntoView();
  }

  function mount(root) {
    if (root.getAttribute('data-mounted') === '1') return;
    root.setAttribute('data-mounted', '1');
    var kind = root.getAttribute('data-widget');
    var kinds = kind === 'mega' ? ['tracker', 'copies', 'revenue'] : [kind];
    var first = kinds[0];
    if (!CATS[first]) { warn('unknown data-widget "' + kind + '"'); root.setAttribute('data-state', 'failed'); root.hidden = true; return; }
    var ids = kinds.map(function (k) { return uniqueId(IDS[k]); });
    var needs = needsFor(kinds);
    loadData(root, needs).then(function (res) {
      root.innerHTML = kinds.map(function (k) { return '<section class="mw-gta6__panel" data-part="' + k + '"></section>'; }).join('');
      var inst = { root: root, needs: needs, charts: kinds.length > 1 || kinds[0] !== 'tracker', parts: [] };
      kinds.forEach(function (k, i) {
        var el = root.children[i];
        el.id = ids[i];
        inst.parts.push({
          kind: k, el: el, platform: 'all', mode: 'launch', last: '', lastNext: '', visible: false, impressed: false,
          stale: false, paused: false, pausedAt: 0, byDay: false, hostLinks: kinds.indexOf('tracker') >= 0 && i === kinds.length - 1,
          showShare: i === kinds.length - 1, shareTo: ids[0]
        });
      });
      apply(inst, res);
      inst.parts.forEach(function (st) { bind(st); bindScroll(st); observe(st); track(CATS[st.kind], 'load', st.kind); });
      root.hidden = false;
      root.setAttribute('data-state', 'ready');
      if (DEBUG) {
        var note = document.createElement('p');
        note.className = 'mw-gta6__note';
        note.textContent = 'Build ' + BUILD + DOT + 'latest reading ' + inst.parts[0].m.r0.date + DOT + 'data ' + (root.getAttribute('data-src') || 'seed');
        root.appendChild(note);
      }
      instances.push(inst);
      scrollToHash();
    }).catch(function (e) {
      root.setAttribute('data-state', 'failed');
      warn('widget hidden: ' + (e && e.message), e);
      if (DEBUG) {
        root.innerHTML = '<p class="mw-gta6__note">GTA 6 vignette not shown: ' + esc(e && e.message) + DOT + 'build ' + esc(BUILD) + '</p>';
      } else {
        root.innerHTML = '';
        root.hidden = true;
      }
      scrollToHash();
    });
  }

  function mountAll() {
    var roots = document.querySelectorAll('.mw-gta6[data-widget]');
    for (var i = 0; i < roots.length; i++) mount(roots[i]);
  }

  // Counter ticks 4x a second; once a minute when the reader prefers reduced motion;
  // never while paused, off screen or in a background tab
  setInterval(function () {
    if (document.hidden) return;
    var now = Date.now();
    var slow = !!(reduced && reduced.matches);
    instances.forEach(function (inst) {
      inst.parts.forEach(function (st) {
        if (!st.visible) return;
        if (slow && now - (st.lastTick || 0) < SLOW_TICK_MS) return;
        st.lastTick = now;
        if (st.kind === 'tracker') { if (!st.paused) tickTracker(st); } else tickChart(st);
      });
    });
  }, TICK_MS);

  setInterval(function () {
    instances.forEach(function (inst) {
      loadData(inst.root, inst.needs).then(function (res) { apply(inst, res); })
        .catch(function (e) { warn('refresh failed, keeping last data', e); });
    });
  }, REFRESH_MS);

  window[NS] = { mountAll: mountAll, version: '1.3.0', build: BUILD };

  function start() {
    mountAll();
    if (!window.MutationObserver) return;
    var queued = false;
    new MutationObserver(function () {
      if (queued) return;
      queued = true;
      setTimeout(function () { queued = false; mountAll(); }, 100);
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
